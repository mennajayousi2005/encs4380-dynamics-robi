<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Module 1: First-order time response</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-basic-dist-min@2.35.2/plotly-basic.min.js"></script>
  <script type="module" src="js/m1.js"></script>
</head>
<body>
  <header id="nav"></header>
  <main>
    <h1>Module 1: First-order time response</h1>
    <p class="lead">A thermometer moved into hot tea: &tau;&#7823; + y = Kx. How long until you can trust the reading?</p>
    <div class="layout">
      <div>
        <div id="predict"></div>
        <div class="panel" style="margin-top:12px">
          <div id="controls"></div>
          <div class="readouts" id="readouts"></div>
        </div>
      </div>
      <div>
        <div id="response" class="plot"></div>
        <div id="error" class="plot small"></div>
        <p class="note">The second plot shows ln(e) with its axis labelled in e, so the slope you read is &minus;1/&tau;. Remember ln e = 2.3 log e: a slope read in base 10 would be &minus;0.434/&tau;.</p>
      </div>
    </div>
    <h2>Validation</h2>
    <div id="checks"></div>
  </main>
</body>
</html>
