<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P2: A slow sensor in the loop</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-basic-dist-min@2.35.2/plotly-basic.min.js"></script>
  <script type="module" src="js/p2.js"></script>
</head>
<body>
  <header id="nav"></header>
  <main>
    <h1>P2: A slow sensor in the loop</h1>
    <p class="lead">The controller only controls what the sensor says. A slow sensor makes it act on old news.</p>
    <div class="layout">
      <div>
        <div id="predict"></div>
        <div class="panel" style="margin-top:12px">
          <div id="presets"></div>
          <div id="controls"></div>
          <div class="readouts" id="readouts"></div>
        </div>
      </div>
      <div>
        <div id="output" class="plot"></div>
        <p id="status" class="note"></p>
        <div id="sweep" class="plot small"></div>
      </div>
    </div>
  </main>
</body>
</html>
